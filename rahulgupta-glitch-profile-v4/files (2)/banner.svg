<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Rahul Gupta - Aspiring Java Developer and Data Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Rahul Gupta - Aspiring Java Developer and Data Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="260" rx="16"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .code { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 13.5px; }
      .t { animation: fade 1s ease-out backwards; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .kw { fill: #c084fc; } .ty { fill: #67e8f9; } .st { fill: #86efac; }
      .nm { fill: #fde047; } .tx { fill: #e2e8f0; } .no { fill: #fb923c; }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <circle cx="900" cy="20" r="150" fill="#f97316" opacity="0.13">
      <animate attributeName="cy" values="20;45;20" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="270" r="120" fill="#0ea5e9" opacity="0.15">
      <animate attributeName="cy" values="270;245;270" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- left: who I am -->
    <text class="t" x="72" y="64" font-size="13" letter-spacing="4" fill="#fdba74" style="animation-delay:.1s">JAVA  •  DATA ENGINEERING</text>
    <text class="t" x="70" y="132" font-size="68" font-weight="800" fill="url(#name)" style="animation-delay:.3s">Rahul Gupta</text>
    <text class="t" x="72" y="172" font-size="25" fill="#e2e8f0" style="animation-delay:.6s">Aspiring Java Developer &amp; Data Engineer</text>
    <text class="t" x="72" y="202" font-size="16" fill="#94a3b8" style="animation-delay:.9s">B.Tech in Artificial Intelligence &amp; Data Science</text>
    <text class="t" x="72" y="234" font-size="14" fill="#67e8f9" style="animation-delay:1.2s">Oracle Certified  •  LeetCode &amp; GFG in Java  •  Open to Java roles</text>

    <!-- right: a tiny Java code window -->
    <g>
      <rect x="668" y="46" width="300" height="168" rx="12" fill="#0b1220" stroke="#334155"/>
      <circle cx="690" cy="66" r="5" fill="#ef4444"/>
      <circle cx="708" cy="66" r="5" fill="#f59e0b"/>
      <circle cx="726" cy="66" r="5" fill="#22c55e"/>
      <text x="948" y="70" text-anchor="end" font-size="11" fill="#64748b">Rahul.java</text>
      <line x1="668" y1="80" x2="968" y2="80" stroke="#1e293b"/>

      <text class="code t" x="688" y="108" style="animation-delay:1.0s"><tspan class="kw">public class</tspan> <tspan class="nm">Rahul</tspan> <tspan class="tx">{</tspan></text>
      <text class="code t" x="708" y="132" style="animation-delay:1.4s"><tspan class="ty">String</tspan> <tspan class="tx">goal</tspan> <tspan class="tx">=</tspan> <tspan class="st">"Java Developer"</tspan><tspan class="tx">;</tspan></text>
      <text class="code t" x="708" y="154" style="animation-delay:1.8s"><tspan class="ty">String</tspan> <tspan class="tx">next</tspan> <tspan class="tx">=</tspan> <tspan class="st">"Data Engineer"</tspan><tspan class="tx">;</tspan></text>
      <text class="code t" x="708" y="176" style="animation-delay:2.2s"><tspan class="ty">boolean</tspan> <tspan class="tx">openToWork</tspan> <tspan class="tx">=</tspan> <tspan class="no">true</tspan><tspan class="tx">;</tspan></text>
      <text class="code t" x="688" y="198" style="animation-delay:2.6s"><tspan class="tx">}</tspan></text>

      <rect x="702" y="187" width="7" height="14" fill="#e2e8f0">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
