# Keeps the profile fresh. One workflow, two jobs:
#   dashboard -> rebuilds the 3D skyline, language chart and project cards
#   snake     -> regenerates the snake game that eats the contribution graph

name: Update Profile

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build skyline, language chart and project cards
        run: python3 scripts/generate_dashboard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Commit updated images
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Update dashboard images"
            git pull --rebase origin main
            git push
          fi

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push the snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
