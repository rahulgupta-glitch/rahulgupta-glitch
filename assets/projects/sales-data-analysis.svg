<svg xmlns="http://www.w3.org/2000/svg" width="440" height="212" viewBox="0 0 440 212" role="img" aria-label="Sales Data Analysis project card"><title>Sales Data Analysis project card</title><style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.card{animation:up .6s ease-out backwards}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>
